[pytest]
# Pytest configuration for backend integration tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum version
minversion = 7.0

# Test paths
testpaths = tests

# Output options
console_output_style = progress
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -p no:cacheprovider

# Markers
markers =
    individual: Tests for individual user registration
    organization: Tests for organization registration
    member: Tests for organization member addition
    cleanup: Tests for cleanup operations
    health: Tests for health check endpoint
    validation: Tests for input validation
    edge_case: Tests for edge cases
    slow: Slow tests that may take longer
    integration: Integration tests (all tests)

# Log settings
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Test execution order
# Ensure cleanup tests run last
# This is also handled in conftest.py
