[project]
name = "rto_predictor"
version = "0.1.0"
description = "rto_predictor"
authors = [{ name = "Anil Gupta", email = "guptaka691@gmail.com" }]
requires-python = ">=3.8"

dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.21.0",
    "scikit-learn>=1.2.0",
    "joblib>=1.2.0",
    "scipy>=1.9.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "xgboost>=1.6.0",
    "lightgbm>=3.3.0",
    "imbalanced-learn>=0.9.0",
    "feature-engine>=1.6.0",
    "optuna>=3.0.0",
    "mlflow>=2.0.0",
    "fastapi>=0.68.0",
    "uvicorn>=0.15.0",
    "pydantic>=1.8.0",
    "python-multipart>=0.0.5",
    "aiofiles>=0.7.0",
    "python-dotenv>=0.19.0",
    "schedule>=1.1.0",
    "psutil>=5.8.0",
    "requests>=2.28.0"
]
[tool.uv]
virtualenvs.in-project = true

[project.optional-dependencies]
dev = ["pytest", "black", "isort"]
docs = ["mkdocs", "mkdocs-material"]
test = ["coverage", "tox"]
