services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: rto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rto_predictions}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d  # Optional: initialization scripts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rto_predictions}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rto-network

  # RTO Prediction Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rto-backend
    restart: unless-stopped
    environment:
      # Database Configuration
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-rto_predictions}

      # API Configuration
      API_HOST: 0.0.0.0
      API_PORT: 8002

      # Application Settings
      PYTHONUNBUFFERED: 1
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # Model Configuration
      MODEL_PATH: ${MODEL_PATH:-models/rto_model.pkl}

      # Feature flags (optional)
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-true}
      ENABLE_CORS: ${ENABLE_CORS:-true}
    ports:
      - "${API_PORT:-8002}:8002"
    volumes:
      # Mount for model persistence
      - ./models:/app/models
      # Mount for backups
      - ./backups:/app/backups
      # Mount for logs
      - ./logs:/app/logs
      # Optional: Mount source code for development (comment out for production)
      # - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - rto-network
    command: >
      sh -c "
        python scripts/init_database.py &&
        python scripts/run_migrations.py upgrade &&
        echo 'Starting API server...' &&
        uvicorn src.apis.api_main:app --host 0.0.0.0 --port 8002 --workers 4
      "

  # Optional: PgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: rto-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@rto.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - rto-network
    profiles:
      - tools  # Only start with: docker-compose --profile tools up

# Networks
networks:
  rto-network:
    driver: bridge

# Volumes
volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
